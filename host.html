<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host — Fake News Auction</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="app-shell"><div class="topbar"><div class="brand">🎛️ FAKE NEWS AUCTION — HOST</div><div class="pill" id="hostStatus">Waiting</div></div>
<div class="grid"><section class="panel question-card"><div class="qnum" id="qnum">Lobby</div><h1 class="headline" id="headline">Ready when you are.</h1><div class="source" id="source">Players can join now</div><p class="teaser" id="teaser">Press Start once. The rest runs automatically.</p><div class="reveal hidden" id="reveal"><div class="truth" id="truth"></div><div id="explanation"></div></div></section>
<aside class="panel"><div class="status-title">Live control</div><div class="timer" id="timer">—<small>seconds</small></div><div class="progress"><div id="progressBar" style="width:0%"></div></div><div class="host-stats" style="margin-top:18px"><div class="stat"><span class="muted">Players</span><strong id="players">0</strong></div><div class="stat"><span class="muted">Submitted</span><strong id="submitted">0</strong></div></div><div class="controls" style="margin-top:18px"><button class="btn primary" id="startBtn">▶ Start Game</button><button class="btn" id="resetBtn">↺ Reset Lobby</button></div><div class="footer-note">No room code • auto-sync • auto-timer</div></aside>
</div>
<section class="panel hidden" id="finalPanel" style="margin-top:22px"><div class="status-title">🏆 Final Results</div><div id="mostEngaging" class="teaser"></div><div id="leaderboard" class="leaderboard" style="margin-top:18px"></div></section>
</div><script type="module" src="/host.js"></script></body></html>
